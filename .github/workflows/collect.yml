name: collect
# Server-side FAA collector, every 15 minutes, whether or not anyone has the site open.
# GitHub's cron scheduler is best-effort (often delayed or skipped), so each run also queues
# the next one (workflow_dispatch with wait=1), which sleeps until the next :04/:19/:34/:49 slot.
# The cron below stays as a backup that restarts the chain if it ever breaks. The concurrency
# group keeps at most one running + one pending run, so chains cannot multiply.
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  push:
    branches: [main]
    paths: ["collector/**", "site/**", "relay/**", ".github/workflows/collect.yml"]
  workflow_dispatch:
    inputs:
      wait:
        description: "Sleep until the next 15-minute slot before collecting"
        default: "0"
permissions:
  contents: write
  actions: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Wait for next 15-minute slot
        if: github.event_name == 'workflow_dispatch' && inputs.wait == '1'
        run: |
          python3 - <<'PY'
          import time, datetime as dt
          now = dt.datetime.now(dt.timezone.utc)
          slots = [4, 19, 34, 49]
          for add in range(0, 61):
              t = (now + dt.timedelta(minutes=add)).replace(second=0, microsecond=0)
              if t.minute in slots and t > now + dt.timedelta(minutes=2):
                  break
          wait = min(900, max(0, (t - now).total_seconds()))
          print(f"sleeping {wait:.0f}s until {t:%H:%M}Z")
          time.sleep(wait)
          PY
      - uses: actions/checkout@v4
      - name: Previous snapshot
        run: |
          if git fetch -q --depth 1 origin data 2>/dev/null; then git show FETCH_HEAD:status.json > /tmp/prev.json || true; fi
          ls -la /tmp/prev.json 2>/dev/null || echo "no previous snapshot"
      - name: Collect
        run: |
          mkdir -p /tmp/out
          python3 collector/groundwatch.py /tmp/out/status.json /tmp/prev.json
      - name: Publish website to gh-pages (single commit, force-pushed)
        run: |
          mkdir -p /tmp/site && cp site/index.html /tmp/site/ && touch /tmp/site/.nojekyll
          python3 relay/build.py /tmp/out/status.json /tmp/site 15 github
          cd /tmp/site
          git init -q -b gh-pages
          git add -A
          git -c user.name=groundwatch-bot -c user.email=groundwatch-bot@users.noreply.github.com commit -qm "site $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
      - name: Publish data branch (single commit, force-pushed)
        run: |
          cd /tmp/out
          git init -q -b data
          git add status.json
          git -c user.name=groundwatch-bot -c user.email=groundwatch-bot@users.noreply.github.com commit -qm "status $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      - name: Queue the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --repo "${{ github.repository }}" --ref main -f wait=1
